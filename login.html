<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Maths & Science Tutor</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="squared">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 23h5v-5h5v-5h5V8h3" fill="none" stroke="#2152c9" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span data-brand></span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="th" aria-pressed="false">ไทย</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>

  <main class="narrow">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-login" aria-selected="true" aria-controls="form-login" data-i18n="login.title">Log in</button>
        <button role="tab" id="tab-signup" aria-selected="false" aria-controls="form-signup" data-i18n="login.signup">Create account</button>
      </div>

      <form id="form-login" class="stack" role="tabpanel" aria-labelledby="tab-login">
        <div class="field"><label for="l-email" data-i18n="login.email"></label><input id="l-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="l-pass" data-i18n="login.password"></label><input id="l-pass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">Log in</button>
        <button class="btn-link" type="button" id="forgot" data-i18n="login.forgot">Forgot password?</button>
      </form>

      <form id="form-signup" class="stack" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <div class="field"><label for="s-name" data-i18n="login.name"></label><input id="s-name" autocomplete="name" required></div>
        <div class="field"><label for="s-role" data-i18n="login.role"></label>
          <select id="s-role"><option value="parent" data-i18n="login.role.parent"></option><option value="student" data-i18n="login.role.student"></option></select>
        </div>
        <div class="field"><label for="s-email" data-i18n="login.email"></label><input id="s-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="s-pass" data-i18n="login.password"></label><input id="s-pass" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-primary" type="submit" data-i18n="login.create">Create account</button>
      </form>

      <form id="form-newpass" class="stack" hidden>
        <h2 data-i18n="login.newpass"></h2>
        <div class="field"><label for="n-pass" data-i18n="login.password"></label><input id="n-pass" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-primary" type="submit" data-i18n="login.savepass">Save password</button>
      </form>

      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script type="module" src="/assets/login.js"></script>
</body>
</html>
