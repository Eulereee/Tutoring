<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My classes — Maths & Science Tutor</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 23h5v-5h5v-5h5V8h3" fill="none" stroke="#2152c9" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span data-brand></span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="th" aria-pressed="false">ไทย</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>

  <main class="dash">
    <div class="wrap">
      <div class="dash-head">
        <div>
          <h1 style="font-size:clamp(1.6rem,1.2rem + 1.5vw,2.2rem)" data-i18n="dash.title">My classes</h1>
          <p class="lead" id="who" style="margin:0"></p>
        </div>
        <button class="btn btn-small" id="logout" data-i18n="dash.logout">Log out</button>
      </div>

      <div class="dash-grid">
        <div>
          <div class="box"><h2 data-i18n="dash.classes">Classes</h2><ul class="list" id="classes"></ul></div>
          <div class="box"><h2 data-i18n="dash.resources">Notes and homework</h2><ul class="list" id="resources"></ul></div>
        </div>
        <div>
          <div class="box"><h2 data-i18n="dash.buy">Pay for a term</h2><div class="stack" id="buy"></div></div>
          <div class="box"><h2 data-i18n="dash.payments">Payments</h2><ul class="list" id="payments"></ul></div>
        </div>
      </div>

      <div class="teacher-zone" id="teacher" hidden>
        <h2 data-i18n="teach.title">Teacher</h2>
        <div class="dash-grid">
          <div>
            <div class="box"><h2 data-i18n="teach.enquiries">Trial requests</h2><ul class="list" id="enquiries"></ul></div>
            <div class="box"><h2 data-i18n="teach.students">Students</h2><ul class="list" id="students"></ul></div>
          </div>
          <div>
            <form class="box stack" id="enrol-form">
              <h2 data-i18n="teach.enrol">Add student to class</h2>
              <div class="field"><label for="e-email" data-i18n="teach.enrol.email"></label><input id="e-email" type="email" required></div>
              <div class="field"><label for="e-course" data-i18n="teach.enrol.course"></label><select id="e-course" class="course-select" required></select></div>
              <button class="btn btn-pen" type="submit" data-i18n="teach.enrol.submit"></button>
              <p class="status" role="status"></p>
            </form>
            <form class="box stack" id="resource-form">
              <h2 data-i18n="teach.resource">Add notes or homework</h2>
              <div class="field"><label for="r-course" data-i18n="teach.enrol.course"></label><select id="r-course" class="course-select" required></select></div>
              <div class="field"><label for="r-title" data-i18n="teach.resource.title"></label><input id="r-title" required maxlength="200"></div>
              <div class="field"><label for="r-url" data-i18n="teach.resource.url"></label><input id="r-url" type="url" placeholder="https://"></div>
              <div class="field"><label for="r-due" data-i18n="teach.resource.due"></label><input id="r-due" type="date"></div>
              <button class="btn btn-pen" type="submit" data-i18n="teach.resource.submit"></button>
              <p class="status" role="status"></p>
            </form>
            <form class="box stack" id="link-form">
              <h2 data-i18n="teach.link">Set lesson link</h2>
              <div class="field"><label for="k-course" data-i18n="teach.enrol.course"></label><select id="k-course" class="course-select" required></select></div>
              <div class="field"><label for="k-url" data-i18n="teach.link.url"></label><input id="k-url" type="url" placeholder="https://"></div>
              <div class="field"><label for="k-schedule" data-i18n="teach.link.schedule"></label><input id="k-schedule" maxlength="120"></div>
              <button class="btn btn-pen" type="submit" data-i18n="teach.link.submit"></button>
              <p class="status" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
